<main class="counter-app">
  <header class="page-header">
    <h1>{{ title() }}</h1>
    <p class="page-subtitle">{{ subtitle() }}</p>
  </header>

  <div class="counter-grid" [class.counter-grid--four]="labels().length === 4">
    @for (label of labels(); track label; let i = $index) {
      <section class="counter-card" [attr.aria-labelledby]="'counter-heading-' + i">
        <header class="counter-header">
          <h2 [id]="'counter-heading-' + i">{{ label }}</h2>
        </header>

        <div class="counter-display" aria-live="polite" aria-atomic="true">
          <span class="counter-value">{{ counts()[i] }}</span>
        </div>

        <div class="counter-actions">
          <button
            type="button"
            class="btn btn-decrement"
            (click)="decrement(i)"
            [attr.aria-label]="'Decrease count for ' + label"
          >
            −
          </button>
          <button
            type="button"
            class="btn btn-reset"
            (click)="reset(i)"
            [disabled]="isZero(i)"
            [attr.aria-label]="'Reset count for ' + label"
          >
            Reset
          </button>
          <button
            type="button"
            class="btn btn-increment"
            (click)="increment(i)"
            [attr.aria-label]="'Increase count for ' + label"
          >
            +
          </button>
        </div>
      </section>
    }
  </div>
</main>
