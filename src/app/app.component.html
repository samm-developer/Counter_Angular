<main class="counter-app">
  <section class="counter-card" aria-labelledby="counter-heading">
    <header class="counter-header">
      <h1 id="counter-heading">Counter</h1>
      <p class="counter-subtitle">Tap the buttons to change the value</p>
    </header>

    <div class="counter-display" aria-live="polite" aria-atomic="true">
      <span class="counter-value">{{ count() }}</span>
    </div>

    <div class="counter-actions">
      <button type="button" class="btn btn-decrement" (click)="decrement()" aria-label="Decrease count">
        −
      </button>
      <button
        type="button"
        class="btn btn-reset"
        (click)="reset()"
        [disabled]="isZero()"
        aria-label="Reset count"
      >
        Reset
      </button>
      <button type="button" class="btn btn-increment" (click)="increment()" aria-label="Increase count">
        +
      </button>
    </div>
  </section>
</main>
